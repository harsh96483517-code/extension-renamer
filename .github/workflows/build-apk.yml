name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtensionRenamer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Gives a permanent, directly installable download URL:
      # https://github.com/<owner>/<repo>/releases/download/latest/app-debug.apk
      - name: Publish APK to "latest" release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Debug APK built automatically from the newest commit on main.
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
